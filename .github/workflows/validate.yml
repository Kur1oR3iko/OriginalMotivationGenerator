name: Build

on:
  push:
    branches:
      - main
      - release/testflight
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project OriginalMotivationGenerator.xcodeproj
          -scheme OriginalMotivationGenerator
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
