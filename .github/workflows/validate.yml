name: Build

on:
  push:
    branches:
      - main
      - release/testflight
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check 25-hour clock calendar
        run: |
          swiftc App/Localization.swift App/Clock25.swift Tests/Clock25Tests.swift -o "$RUNNER_TEMP/omg-clock-tests"
          "$RUNNER_TEMP/omg-clock-tests"

      - name: Check one-time press persistence
        run: |
          swiftc App/Localization.swift App/OncePressStore.swift Tests/OncePressStoreTests.swift -o "$RUNNER_TEMP/omg-once-tests"
          "$RUNNER_TEMP/omg-once-tests"

      - name: Check death clock assumptions and persistence
        run: |
          swiftc App/Localization.swift App/DeathClock.swift Tests/DeathClockTests.swift -o "$RUNNER_TEMP/omg-death-tests"
          "$RUNNER_TEMP/omg-death-tests"

      - name: Check breathing, dormancy and application behavior
        run: |
          swiftc App/Localization.swift App/InteractiveArtModels.swift Tests/InteractiveArtTests.swift -o "$RUNNER_TEMP/omg-interactive-art-tests"
          "$RUNNER_TEMP/omg-interactive-art-tests"

      - name: Check localization coverage and language fallback
        run: |
          swiftc App/Localization.swift App/KurioPhraseGenerator.swift Tests/LocalizationTests.swift -o "$RUNNER_TEMP/omg-localization-tests"
          "$RUNNER_TEMP/omg-localization-tests"

      - name: Build localized app for iOS Simulator
        run: >-
          xcodebuild
          -project OriginalMotivationGenerator.xcodeproj
          -scheme OriginalMotivationGenerator
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
